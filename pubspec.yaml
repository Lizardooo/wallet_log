name: wallet_log
description: Reads e-wallet SMS (Vodafone Cash, InstaPay, Orange Cash, Etisalat Cash / Fawry) and keeps a searchable transaction log.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.0
  excel: ^4.0.6
  file_selector: ^1.0.3
  path_provider: ^2.1.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
